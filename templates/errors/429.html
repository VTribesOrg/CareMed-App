<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareMed | Too Many Requests</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-circle.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 520px;
            padding: 40px 24px;
        }

        .shield-icon {
            font-size: 72px;
            color: #f59e0b;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .code {
            font-size: 5rem;
            font-weight: 800;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .desc {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .support-note {
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .countdown-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .countdown-text span {
            color: #f59e0b;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .btn {
            display: none;
            align-items: center;
            gap: 8px;
            background: #f59e0b;
            color: #0f172a;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background .15s;
        }

        .btn.visible {
            display: inline-flex;
        }

        .btn:hover { background: #d97706; }
    </style>
</head>
<body>
    <div class="container">

        <span class="material-symbols-rounded shield-icon">timer</span>

        <div class="code">429</div>
        <h1>Slow Down a Moment</h1>

        <p class="desc">{{ message }}</p>

        <p class="support-note">If you believe this is a mistake, please contact support.</p>

        <p class="countdown-text" id="countdown-text">
            You can try again in <span id="countdown">300</span> seconds.
        </p>

        <a href="{{ back_url }}" class="btn" id="back-btn">
            <span class="material-symbols-rounded" style="font-size:18px;">arrow_back</span>
            {{ back_label }}
        </a>

    </div>

    <script nonce="{{ csp_nonce() }}">
        const DEADLINE = {{ deadline }};

        const countdownEl = document.getElementById('countdown');
        const countdownText = document.getElementById('countdown-text');
        const backBtn = document.getElementById('back-btn');

        function tick() {
            const remaining = Math.max(0, DEADLINE - Math.floor(Date.now() / 1000));
            countdownEl.textContent = remaining;

            if (remaining <= 0) {
                countdownText.style.display = 'none';
                backBtn.classList.add('visible');
            } else {
                setTimeout(tick, 1000);
            }
        }

        tick();
    </script>

</body>
</html>
