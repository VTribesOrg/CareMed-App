services:
  web:
    build: .
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./static/uploads:/app/caremed/static/uploads
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQLDUMP_PATH: mysqldump
      MYSQL_DATABASE: caremed_db
      MYSQL_USER: caremed_user
      MYSQL_PASSWORD: C@reMed_@2026@ppMYSQL
      MYSQL_ROOT_PASSWORD: MYSQLrootp@ssword@2123
    command: [
      "mysqld",
      "--innodb_buffer_pool_size=64M",
      "--key_buffer_size=16M",
      "--max_connections=50"
    ]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMYSQLrootp@ssword@2123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mysql_data:
  redis_data:
